name: Deploy to GitHub Pages and Aliyun ECS

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Configure SSH for Aliyun
        env:
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_KEY" > "$HOME/.ssh/aliyun_deploy_key"
          chmod 600 "$HOME/.ssh/aliyun_deploy_key"

          ssh-keyscan -t ed25519 120.77.79.138 > /tmp/aliyun_host_key 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf /tmp/aliyun_host_key -E sha256 | awk '{print $2}')"
          expected_fingerprint="SHA256:EbT3WQEtESMow8rGZu+n+DcNEVMDVhIweM0wNK5yItQ"

          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "Aliyun SSH host key fingerprint mismatch."
            exit 1
          fi

          cat /tmp/aliyun_host_key >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to Aliyun ECS
        env:
          ALIYUN_HOST: 120.77.79.138
          ALIYUN_USER: agent
          ALIYUN_TARGET: /var/www/calcx.startyi.cn
        run: |
          SSH=(ssh -i "$HOME/.ssh/aliyun_deploy_key" -o IdentitiesOnly=yes "$ALIYUN_USER@$ALIYUN_HOST")
          STAGING="/home/agent/calcx-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          "${SSH[@]}" "rm -rf '$STAGING' && mkdir -p '$STAGING'"
          tar -C dist -czf - . | "${SSH[@]}" "tar -xzf - -C '$STAGING'"
          "${SSH[@]}" "set -eu; find '$ALIYUN_TARGET' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; cp -a '$STAGING'/. '$ALIYUN_TARGET'/; rm -rf '$STAGING'"